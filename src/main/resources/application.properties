# ==============================================================================
# Spring Boot Application Configuration
# ==============================================================================
# 이 파일은 애플리케이션의 실행 환경 설정을 관리합니다.
# 환경변수를 통해 민감 정보를 주입받아 보안성을 향상시킵니다.
#
# 형식: property=${ENV_VAR:default_value}
# - ENV_VAR: 환경변수 이름
# - default_value: 환경변수가 없을 때 사용할 기본값 (선택사항)
# ==============================================================================

spring.application.name=lien


# ==============================================================================
# Database Configuration (MySQL 8.0)
# ==============================================================================
# 역할: MySQL 데이터베이스 연결 설정
#
# 이점:
# - 환경변수로 보안 정보 관리 (Git에 민감 정보 노출 방지)
# - 환경별(개발/운영) 다른 DB 사용 가능
# - Docker Compose 환경에서 자동 연결
#
# 예시 환경변수:
# DB_HOST=mysql (Docker) 또는 localhost (로컬)
# MYSQL_DATABASE=lien_db
# MYSQL_USER=lien_user
# MYSQL_PASSWORD=secure_password_here
# ==============================================================================

# JDBC URL 구성 요소 설명:
# - jdbc:mysql://: MySQL JDBC 프로토콜
# - ${DB_HOST:localhost}: 호스트명 (기본값: localhost)
# - 3306: MySQL 기본 포트
# - ${MYSQL_DATABASE:lien_db}: 데이터베이스명
# - serverTimezone=Asia/Seoul: 한국 시간대 설정 (날짜/시간 일관성)
# - useSSL=false: 로컬 개발용 (운영 환경에서는 true 권장)
# - allowPublicKeyRetrieval=true: 공개키 방식 인증 허용
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${MYSQL_DATABASE:lien_db}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true

# 데이터베이스 인증 정보 (환경변수 필수)
# 보안: 기본값 제거하여 환경변수 강제 설정
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# MySQL 8.0 드라이버 (com.mysql.cj는 최신 버전)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==============================================================================
# HikariCP Connection Pool Configuration
# ==============================================================================
# 역할: 데이터베이스 커넥션 풀 관리 (HikariCP는 Spring Boot 기본)
#
# 이점:
# - 커넥션 재사용으로 성능 향상
# - 동시 요청 처리 능력 향상
# - 리소스 효율적 관리
#
# 성능 비교:
# - Connection Pool 없음: 요청당 100-200ms (DB 연결 시간)
# - Connection Pool 사용: 요청당 1-5ms (기존 연결 재사용)
# ==============================================================================

# maximum-pool-size: 최대 커넥션 수
# 이점: 동시에 10개의 DB 연결 유지 가능
# 예시: 사용자 100명이 동시 접속해도 순차적으로 처리 (큐잉)
# 권장값: CPU 코어수 * 2 ~ 4
spring.datasource.hikari.maximum-pool-size=10

# minimum-idle: 최소 유휴 커넥션 수
# 이점: 트래픽 급증 시 즉시 대응 가능
# 예시: 평소 5개 연결 유지, 필요 시 10개까지 확장
spring.datasource.hikari.minimum-idle=5

# connection-timeout: 커넥션 획득 대기 시간 (밀리초)
# 이점: 무한 대기 방지, 빠른 실패 처리
# 예시: 20초 내 커넥션 못 얻으면 SQLException 발생
spring.datasource.hikari.connection-timeout=20000

# idle-timeout: 유휴 커넥션 유지 시간 (10분)
# 이점: 사용하지 않는 커넥션 정리로 리소스 절약
# 예시: 10분간 사용 안 된 커넥션 자동 제거
spring.datasource.hikari.idle-timeout=600000

# max-lifetime: 커넥션 최대 생명 주기 (30분)
# 이점: 오래된 커넥션 갱신으로 안정성 향상
# 예시: 30분마다 커넥션 재생성 (DB 연결 타임아웃 방지)
spring.datasource.hikari.max-lifetime=1800000


# ==============================================================================
# JPA & Hibernate Configuration
# ==============================================================================
# 역할: JPA(Java Persistence API) 및 Hibernate ORM 설정
#
# 이점:
# - SQL 작성 없이 객체 지향적 데이터 처리
# - 데이터베이스 독립성 (MySQL → PostgreSQL 전환 용이)
# - 자동 스키마 관리
# ==============================================================================

# ddl-auto: 스키마 자동 생성 전략
# - update: 기존 테이블 유지, 변경사항만 반영 (개발 환경)
# - create: 매번 테이블 재생성 (테스트 환경)
# - validate: 스키마 검증만 (운영 환경 권장)
# - none: 아무것도 하지 않음 (운영 환경 권장)
#
# 예시: Entity 클래스에 필드 추가 시 자동으로 컬럼 추가
# @Entity class User { 
#   private String newField; // <- 이 필드 추가 시 ALTER TABLE 자동 실행
# }
spring.jpa.hibernate.ddl-auto=update

# show-sql: SQL 쿼리 콘솔 출력
# 이점: 어떤 쿼리가 실행되는지 확인 가능 (디버깅)
# 예시 출력:
# Hibernate: select user0_.id, user0_.email from users user0_ where user0_.email=?
spring.jpa.show-sql=true

# open-in-view: OSIV(Open Session In View) 패턴
# false 설정 이점:
# - LazyInitializationException 명시적 발견
# - 트랜잭션 범위 명확화
# - 데이터베이스 커넥션 빠른 반환 (성능 향상)
#
# 예시:
# @Transactional // 이 메서드 안에서만 Lazy Loading 가능
# public void processTemplate() {
#   Template template = templateRepository.findById(1L);
#   template.getDaySchedules().size(); // OK
# }
# // 여기서는 template.getDaySchedules() 호출 시 예외 발생 (의도적)
spring.jpa.open-in-view=false

# dialect: SQL 방언 설정
# 이점: MySQL 8.0 전용 기능 사용 가능 (JSON 타입, Window Function 등)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# format_sql: SQL 포맷팅 (가독성 향상)
# 이점: 디버깅 시 쿼리 읽기 쉬움
#
# 예시:
# -- format_sql=false
# select user0_.id, user0_.email, user0_.name from users user0_ where user0_.id=?
#
# -- format_sql=true
# select
#     user0_.id,
#     user0_.email,
#     user0_.name
# from
#     users user0_
# where
#     user0_.id=?
spring.jpa.properties.hibernate.format_sql=true

# jdbc.batch_size: 배치 INSERT/UPDATE 크기
# 이점: 여러 쿼리를 묶어서 실행하여 성능 향상
#
# 예시:
# // 100개의 템플릿 생성 시
# // batch_size=1: INSERT 쿼리 100번 실행 (느림)
# // batch_size=20: INSERT 쿼리 5번 실행 (20개씩 묶음, 빠름)
# List<Template> templates = ...
# templateRepository.saveAll(templates);
spring.jpa.properties.hibernate.jdbc.batch_size=20

# order_inserts/order_updates: 배치 최적화
# 이점: 같은 테이블 쿼리를 그룹화하여 배치 효율 극대화
#
# 예시:
# // order_inserts=true
# INSERT INTO templates ... (20개 묶음)
# INSERT INTO day_schedules ... (20개 묶음)
#
# // order_inserts=false
# INSERT INTO templates ...
# INSERT INTO day_schedules ...
# INSERT INTO templates ...
# INSERT INTO day_schedules ... (비효율적)
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# ==============================================================================
# Redis Configuration
# ==============================================================================
# 역할: 인메모리 캐시 및 세션 스토어
#
# 이점:
# - 빠른 읽기/쓰기 (메모리 기반, ~100배 빠름)
# - JWT 블랙리스트 관리
# - API 응답 캐싱
# - 세션 클러스터링 (다중 서버 환경)
#
# 예시:
# // 사용자 정보 캐싱 (DB 조회 대신 Redis 사용)
# @Cacheable(value = "users", key = "#id")
# public User findById(Long id) {
#   return userRepository.findById(id); // 첫 호출만 DB 조회, 이후 Redis 사용
# }
#
# // 로그아웃 시 토큰 블랙리스트 추가
# redisTemplate.opsForValue().set("blacklist:" + token, "true", 1, TimeUnit.HOURS);
# ==============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


# ==============================================================================
# JWT Configuration
# ==============================================================================
# 역할: JSON Web Token 인증 설정
#
# 이점:
# - Stateless 인증 (서버 세션 불필요)
# - 확장성 향상 (로드밸런서 사용 시 세션 공유 불필요)
# - 모바일/SPA에 적합
#
# 보안 요구사항:
# - jwt.secret: 최소 256bit (32자) 이상의 강력한 랜덤 문자열
# - 운영 환경에서는 반드시 환경변수로 설정 (절대 하드코딩 금지)
#
# 예시:
# // 토큰 생성
# String token = Jwts.builder()
#   .setSubject("user@example.com")
#   .setIssuedAt(new Date())
#   .setExpiration(new Date(System.currentTimeMillis() + 3600000)) // 1시간
#   .signWith(key, SignatureAlgorithm.HS256)
#   .compact();
#
# // 결과: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyQGV4YW1wbGUuY29tIn0...
# ==============================================================================

# JWT 시크릿 키 (환경변수 필수, 기본값 없음)
# 보안: 기본값 제거하여 운영 환경 배포 시 반드시 설정하도록 강제
jwt.secret=${JWT_SECRET_KEY}

# JWT 만료 시간 (밀리초)
# 기본값: 3600000ms = 1시간
# 예시:
# - 1시간: 3600000
# - 1일: 86400000
# - 7일: 604800000
jwt.expiration=${JWT_EXPIRATION_MS:3600000}


# ==============================================================================
# Logging Configuration
# ==============================================================================
# 역할: 애플리케이션 로그 레벨 설정
#
# 로그 레벨:
# - TRACE: 가장 상세 (모든 정보)
# - DEBUG: 디버깅 정보
# - INFO: 일반 정보 (기본값)
# - WARN: 경고
# - ERROR: 에러만
#
# 이점:
# - 디버깅 용이
# - 성능 문제 파악
# - 보안 이슈 추적
# ==============================================================================

# com.lien 패키지 전체 DEBUG 레벨
# 예시 출력:
# 2024-01-15 10:30:45.123 DEBUG [com.lien.service.TemplateService] - Creating template: 제주도 여행
logging.level.com.lien=DEBUG

# Spring Security 로그 (인증/인가 디버깅)
# 예시 출력:
# 2024-01-15 10:30:45.456 DEBUG [o.s.security] - /api/templates at position 1 of 12 in additional filter chain
logging.level.org.springframework.security=DEBUG

# Hibernate SQL 쿼리 로그
# 예시 출력:
# 2024-01-15 10:30:45.789 DEBUG [org.hibernate.SQL] - select user0_.id from users user0_ where user0_.email=?
logging.level.org.hibernate.SQL=DEBUG

# Hibernate 파라미터 바인딩 로그 (TRACE)
# 예시 출력:
# 2024-01-15 10:30:45.790 TRACE [o.h.type.descriptor.sql.BasicBinder] - binding parameter [1] as [VARCHAR] - [user@example.com]
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ==============================================================================
# Server Error Configuration
# ==============================================================================
# 역할: 에러 응답에 포함할 정보 설정
#
# 이점:
# - 프론트엔드에서 에러 메시지 표시 가능
# - Validation 에러 상세 정보 제공
# - 디버깅 용이
#
# 보안 주의:
# - 운영 환경에서는 include-stacktrace=never 권장 (내부 정보 노출 방지)
# ==============================================================================

# 에러 메시지 항상 포함
# 예시 응답:
# {
#   "timestamp": "2024-01-15T10:30:45.123+00:00",
#   "status": 400,
#   "error": "Bad Request",
#   "message": "이메일은 필수입니다",  <- 이 부분
#   "path": "/api/auth/register"
# }
server.error.include-message=always

# Validation 에러 상세 정보 포함
# 예시 응답:
# {
#   "errors": [
#     {"field": "email", "message": "이메일 형식이 올바르지 않습니다"},
#     {"field": "password", "message": "비밀번호는 최소 8자 이상이어야 합니다"}
#   ]
# }
server.error.include-binding-errors=always

# 스택 트레이스 포함 조건
# - always: 항상 포함
# - never: 절대 포함 안 함 (운영 환경 권장)
# - on_param: ?trace=true 파라미터 있을 때만 포함 (개발 환경 권장)
#
# 예시: http://localhost:8080/api/templates/999?trace=true
# -> 존재하지 않는 리소스 요청 시 전체 스택 트레이스 확인 가능
server.error.include-stacktrace=on_param
