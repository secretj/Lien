# ==============================================================================
# Docker Compose Configuration for Lien Application
# ==============================================================================
# 이 파일은 개발 및 운영 환경에서 전체 스택을 실행하기 위한 설정입니다.
#
# 실행 방법:
# $ docker compose up -d          # 백그라운드 실행
# $ docker compose logs -f app    # 로그 확인
# $ docker compose down           # 중지 및 제거
# $ docker compose down -v        # 볼륨까지 삭제 (데이터 초기화)
#
# 아키텍처:
# [Client:8081] ← HTTP → [App:8080] ← JDBC → [MySQL:3306]
#                            ↓
#                        [Redis:6379]
# ==============================================================================


# ==============================================================================
# Network Configuration
# ==============================================================================
# 역할: 컨테이너 간 통신을 위한 가상 네트워크 생성
#
# 이점:
# 1. 컨테이너 간 이름으로 통신 가능
#    예시: jdbc:mysql://mysql:3306/lien_db (IP 주소 불필요)
#
# 2. 외부 네트워크와 격리 (보안)
#    예시: Redis는 6379 포트 노출하지만 내부 네트워크에서만 접근
#
# 3. 서비스 디스커버리 자동화
#    예시: app 컨테이너에서 'mysql'로 DNS 조회 시 MySQL 컨테이너 IP 반환
#
# driver: bridge 설명:
# - 단일 호스트 네트워크 (같은 서버의 컨테이너들)
# - 다중 호스트는 overlay 드라이버 사용
# ==============================================================================
networks:
  lien-network:
    driver: bridge


services:
  # ==============================================================================
  # MySQL Database Service
  # ==============================================================================
  # 역할: 애플리케이션 데이터 영구 저장
  #
  # 이점:
  # - 관계형 데이터 모델 (User, Template, DaySchedule 등)
  # - ACID 트랜잭션 보장
  # - 복잡한 쿼리 지원 (JOIN, 서브쿼리 등)
  #
  # 데이터 예시:
  # users 테이블:
  # | id | email              | name   | created_at          |
  # |----|-------------------|--------|---------------------|
  # | 1  | user@example.com  | 홍길동  | 2024-01-15 10:30:00 |
  #
  # templates 테이블:
  # | id | user_id | title      | destination | start_date | end_date   |
  # |----|---------|-----------|-------------|------------|------------|
  # | 1  | 1       | 제주도 여행 | 제주도       | 2024-02-01 | 2024-02-05 |
  # ==============================================================================
  mysql:
    # MySQL 8.0 공식 이미지 (LTS 버전)
    image: mysql:8.0
    
    # 컨테이너 이름 (네트워크 내 호스트명으로 사용)
    container_name: mysql
    
    # .env 파일에서 환경변수 로드
    # 보안: 민감한 정보를 코드에서 분리
    env_file:
      - .env
    
    # MySQL 초기화 환경변수
    # MYSQL_ROOT_PASSWORD: root 계정 비밀번호 (필수)
    # MYSQL_DATABASE: 자동 생성할 데이터베이스명
    # MYSQL_USER: 일반 사용자 계정 (권한 제한)
    # MYSQL_PASSWORD: 일반 사용자 비밀번호
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    
    # 포트 매핑: 호스트:컨테이너
    # 이점: 로컬 MySQL 클라이언트로 직접 접속 가능
    # 예시: mysql -h localhost -P 3306 -u lien_user -p
    ports:
      - "3306:3306"
    
    # 볼륨 마운트: 데이터 영구 보존
    # 역할: 컨테이너 재시작 시에도 데이터 유지
    # 경로: /var/lib/mysql (MySQL 데이터 디렉토리)
    # 
    # 예시:
    # $ docker compose down    # 컨테이너 삭제
    # $ docker compose up      # 재시작
    # -> 데이터 그대로 유지 (mysql-data 볼륨 덕분)
    volumes:
      - mysql-data:/var/lib/mysql
    
    # 네트워크 연결
    networks:
      - lien-network
    
    # 헬스체크: MySQL 서버 준비 상태 확인
    # 역할: 다른 서비스가 MySQL 준비될 때까지 대기
    # 
    # test: mysqladmin ping 명령으로 MySQL 응답 확인
    # interval: 10초마다 체크
    # timeout: 5초 내 응답 없으면 실패
    # retries: 5번 실패 시 unhealthy 상태
    #
    # 이점: app 서비스가 MySQL 준비 전에 실행되어 연결 실패하는 문제 방지
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    # 재시작 정책: unless-stopped
    # 역할: 컨테이너 종료 시 자동 재시작 (수동 중지 제외)
    # 
    # 옵션:
    # - no: 자동 재시작 안 함
    # - always: 항상 재시작
    # - on-failure: 에러 시에만 재시작
    # - unless-stopped: 수동 중지 전까지 재시작 ✓
    restart: unless-stopped


  # ==============================================================================
  # Redis Cache Service
  # ==============================================================================
  # 역할: 인메모리 캐싱 및 세션 스토어
  #
  # 이점:
  # - 빠른 읽기/쓰기 (MySQL 대비 ~100배 빠름)
  # - JWT 블랙리스트 관리
  # - API 응답 캐싱
  # - 사용자 세션 저장
  #
  # 사용 예시:
  # 1. JWT 블랙리스트:
  #    SET blacklist:eyJhbGciOiJIUz... "true" EX 3600
  #    -> 로그아웃한 토큰 1시간 동안 저장
  #
  # 2. 템플릿 캐싱:
  #    SET templates:1 '{"id":1,"title":"제주도 여행",...}' EX 300
  #    -> 템플릿 조회 결과 5분간 캐싱
  #
  # 3. 사용자 세션:
  #    SET session:abc123 '{"userId":1,"email":"user@example.com"}' EX 1800
  #    -> 세션 정보 30분 유지
  #
  # 성능 비교:
  # - MySQL 조회: 평균 10-50ms
  # - Redis 조회: 평균 0.1-1ms (10-50배 빠름)
  # ==============================================================================
  redis:
    # Redis 최신 버전 (Alpine Linux 기반)
    image: 'redis:latest'
    
    container_name: redis
    
    # Redis 기본 포트 노출
    # 참고: 외부 노출이지만 네트워크 격리로 보안 유지
    ports:
      - '6379:6379'
    
    networks:
      - lien-network
    
    # 헬스체크: Redis 서버 응답 확인
    # test: redis-cli ping 명령 (응답: PONG)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    
    restart: unless-stopped


  # ==============================================================================
  # Spring Boot Application Service
  # ==============================================================================
  # 역할: 백엔드 API 서버
  #
  # 제공 기능:
  # - 사용자 인증/인가 (JWT)
  # - 템플릿 CRUD API
  # - 일정 관리 API
  # - 위치 정보 API
  #
  # API 예시:
  # POST   /api/auth/register     # 회원가입
  # POST   /api/auth/login        # 로그인
  # GET    /api/templates         # 템플릿 목록
  # POST   /api/templates         # 템플릿 생성
  # GET    /api/templates/{id}    # 템플릿 상세
  # PUT    /api/templates/{id}    # 템플릿 수정
  # DELETE /api/templates/{id}    # 템플릿 삭제
  # ==============================================================================
  app:
    # Dockerfile로 이미지 빌드
    # context: 빌드 컨텍스트 (현재 디렉토리)
    # dockerfile: 사용할 Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: lien-app
    
    # .env 파일에서 환경변수 로드
    env_file:
      - .env
    
    # Spring Boot 기본 포트
    # 이점: 브라우저/Postman에서 http://localhost:8080/api 접근 가능
    ports:
      - "8080:8080"
    
    # 애플리케이션 환경변수
    # 역할: Spring Boot application.properties에서 참조
    #
    # 예시:
    # spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${MYSQL_DATABASE}
    # -> jdbc:mysql://mysql:3306/lien_db 로 변환
    environment:
      DB_HOST: ${DB_HOST}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    
    networks:
      - lien-network
    
    # 의존성: MySQL과 Redis가 준비된 후 시작
    # condition: service_healthy
    # 역할: 헬스체크 통과할 때까지 대기
    #
    # 이점:
    # - "Connection refused" 에러 방지
    # - 안정적인 시작 보장
    #
    # 타임라인:
    # 0초:  MySQL 컨테이너 시작
    # 10초: MySQL 헬스체크 통과
    # 11초: Redis 컨테이너 시작
    # 15초: Redis 헬스체크 통과
    # 16초: app 컨테이너 시작 ← depends_on으로 제어
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    restart: unless-stopped


  # ==============================================================================
  # Frontend Client Service (Nginx)
  # ==============================================================================
  # 역할: 정적 파일 서빙 (HTML, CSS, JavaScript)
  #
  # 제공 페이지:
  # - /                 : 로그인 페이지
  # - /register.html    : 회원가입 페이지
  # - /home.html        : 메인 페이지 (인증 필요)
  # - /templates.html   : 템플릿 관리 페이지
  #
  # 기술 스택:
  # - Nginx (웹 서버)
  # - HTML5, CSS3
  # - JavaScript (ES6+)
  # - Fetch API (백엔드 통신)
  #
  # 예시 흐름:
  # 1. 사용자가 http://localhost:8081 접속
  # 2. Nginx가 index.html 제공
  # 3. JavaScript에서 http://localhost:8080/api/auth/login 호출
  # 4. JWT 토큰 받아서 LocalStorage 저장
  # 5. 이후 API 요청 시 Authorization: Bearer <token> 헤더 추가
  # ==============================================================================
  client:
    # client 디렉토리의 Dockerfile로 빌드
    build:
      context: ./client
      dockerfile: Dockerfile
    
    container_name: lien-client
    
    # Nginx 기본 포트 80을 8081로 매핑
    # 이점: 백엔드(8080)와 포트 충돌 방지
    ports:
      - "8081:80"
    
    networks:
      - lien-network
    
    # 의존성: app 서비스 시작 후 실행
    # 참고: condition 없으면 시작만 확인 (준비 상태 X)
    depends_on:
      - app
    
    restart: unless-stopped


# ==============================================================================
# Volumes Configuration
# ==============================================================================
# 역할: 데이터 영구 저장소
#
# 이점:
# 1. 컨테이너 삭제 시에도 데이터 보존
# 2. 백업 및 복원 용이
# 3. 다른 컨테이너와 공유 가능
#
# 관리 명령어:
# $ docker volume ls                  # 볼륨 목록
# $ docker volume inspect mysql-data  # 볼륨 상세 정보
# $ docker volume rm mysql-data       # 볼륨 삭제 (주의!)
#
# 백업 예시:
# $ docker run --rm \
#   -v mysql-data:/data \
#   -v $(pwd):/backup \
#   ubuntu tar czf /backup/mysql-backup.tar.gz -C /data .
#
# 복원 예시:
# $ docker run --rm \
#   -v mysql-data:/data \
#   -v $(pwd):/backup \
#   ubuntu tar xzf /backup/mysql-backup.tar.gz -C /data
# ==============================================================================
volumes:
  mysql-data:
